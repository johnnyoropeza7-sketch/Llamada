let have=new Set();tx('readonly',s=>s.getAllKeys()).then(k=>{have=new Set(k);applyBg();applyIcon()}).catch(()=>{});
async function applyBg(){const b=have.has('bg')?await get('bg'):null,r=document.documentElement.style;
 if(b)r.setProperty('--bg','url('+URL.createObjectURL(b)+') center/cover');else r.removeProperty('--bg')}
const IC0=$('#ic').getAttribute('href');
async function applyIcon(){
 const b=have.has('icon')?await get('icon'):null;
 if(!b){$('#ic').setAttribute('href',IC0);return}
 try{const im=await createImageBitmap(b),m=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=180;
  c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,180,180);
  $('#ic').setAttribute('href',c.toDataURL('image/png'))}catch(e){$('#ic').setAttribute('href',IC0)}}

/* ---------- Bloqueo ---------- */
function clock(){const d=new Date();$('#t').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');$('#d').textContent=d.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})}
setInterval(clock,1000);clock();
let lp;
$('#t').onpointerdown=()=>{lp=setTimeout(()=>{render();go('ad')},900)};
$('#t').onpointerup=$('#t').onpointerleave=()=>clearTimeout(lp);
$('#lk').onpointerup=()=>{if($('#lk').classList.contains('on')){buf=[];dots();go('kp')}};

/* ---------- Código: 2 dígitos valor + 1 palo + 1 libre ---------- */
let buf=[],card=null;
const LT={2:'ABC',3:'DEF',4:'GHI',5:'JKL',6:'MNO',7:'PQRS',8:'TUV',9:'WXYZ'};
$('#pd').innerHTML=[1,2,3,4,5,6,7,8,9].map(n=>`<b data-n="${n}">${n}<small>${LT[n]||''}</small></b>`).join('')+'<span class=tx>Emergencia</span><b data-n="0">0<small></small></b><span class=tx id=cc>Cancelar</span>';
const dots=()=>{$$('.dots i').forEach((e,i)=>e.classList.toggle('f',i<buf.length));const c=$('#cc');if(c)c.textContent=buf.length?'Borrar':'Cancelar'};
$('#pd').onclick=e=>{
 if(e.target.id=='cc'){if(buf.length){buf.pop();dots()}else go('lk');return}
 const b=e.target.closest('b');if(!b||buf.length>3)return;buf.push(b.dataset.n);dots();if(buf.length==4)setTimeout(chk,160)};
function chk(){const v=+(buf[0]+buf[1]),s=+buf[2];
 if(v>=1&&v<=13&&s>=1&&s<=4){card={v,s};dial()}
 else{const d=$('.dots');d.classList.add('sh');setTimeout(()=>{d.classList.remove('sh');buf=[];dots()},420)}}

/* ---------- Marcado ---------- */
const PD='M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.02-.24 11.36 11.36 0 003.57.57 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.25 1.02z';
const PH=`<svg viewBox="0 0 24 24" width="34" height="34" fill="#fff"><path d="${PD}"/></svg>`;
$('#dc').innerHTML=PH;$('#hg').innerHTML=PH.replace('<svg','<svg style="transform:rotate(135deg)"');
let num='';
$('#dp').innerHTML=['1','2','3','4','5','6','7','8','9','*','0','#'].map(n=>`<b data-n="${n}">${n=='*'?'<i>∗</i>':n}${n=='*'||n=='#'?'':`<small${n=='0'?' class=pl':''}>${n=='0'?'+':(LT[n]||'')}</small>`}</b>`).join('');
const showNum=()=>{$('#dn').textContent=num;$('#dx').style.opacity=num?.85:0};
$('#dp').onclick=e=>{const b=e.target.closest('b');if(b&&num.length<15){num+=b.dataset.n;showNum()}};
$('#dx').onclick=()=>{num=num.slice(0,-1);showNum()};
function dial(){num='';go('dl');showNum()}

/* ---------- Llamada ---------- */
const SIL='data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
let A=new Audio(),AC,tm,T0,seq=[],ix=0,wait=false,busy=false,alive=false,gt;
function ring(){AC=new(window.AudioContext||window.webkitAudioContext)();AC.resume();const t=AC.currentTime;
 [0,3,6,9].forEach(s=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=425;g.gain.value=.2;o.connect(g);g.connect(AC.destination);o.start(t+s);o.stop(t+s+1.3)})}
const stopRing=()=>{try{AC&&AC.close()}catch(e){}AC=null};
$('#dc').onclick=()=>{if(!num)return;alive=true;A.src=SIL;A.play().catch(()=>{});ring();
 go('cl');$('#cn').textContent=num;$('#cs').textContent='llamando…';$('#sp').classList.remove('on');
 setTimeout(()=>{if(alive)answer()},12200)};
const tick=()=>{const s=Math.floor((Date.now()-T0)/1000);$('#cs').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function answer(){stopRing();T0=Date.now();$('#sp').classList.add('on');tm=setInterval(tick,500);tick();
 seq=[...cfg.conv.filter(k=>have.has(k)),'card'];ix=0;busy=false;setTimeout(()=>alive&&play(),1200)}
async function play(){
 if(!alive||busy||ix>=seq.length)return;
 busy=true;wait=false;clearTimeout(gt);
 let k=seq[ix++];if(k=='card')k='c'+card.s+'_'+card.v;
 const b=have.has(k)?await get(k):null;
 if(!alive){busy=false;return}
 if(!b){
  if(k[0]=='c'){const u=new SpeechSynthesisUtterance('el '+cname(card.v,card.s));u.lang='es-ES';u.onend=done;speechSynthesis.speak(u)}
  else done();
  return}
 A.src=URL.createObjectURL(b);A.onended=done;A.play().catch(done)}
function done(){busy=false;if(!alive||ix>=seq.length)return;wait=true;if(cfg.gap>0)gt=setTimeout(play,cfg.gap*1000)}
$('#cz').onclick=()=>{if(wait)play()};
$('#hg').onclick=()=>{alive=false;busy=false;wait=false;clearTimeout(gt);clearInterval(tm);A.pause();A.onended=null;try{speechSynthesis.cancel()}catch(e){}stopRing();go('lk')};

/* ---------- Panel de audios ---------- */
let tab='c',su=2,R=null,RK=null;
function row(k,label){const h=have.has(k);
 return `<div class=r><span class="${h?'ok':''}">${h?'✓ ':''}${label}</span><button data-a=rec data-k="${k}">${RK==k?'■ Parar':'● Grabar'}</button><label class=b>Subir<input type=file accept="audio/*" data-k="${k}" hidden></label><button data-a=pl data-k="${k}" ${h?'':'disabled'}>▶</button></div>`}
function render(){
 let h=`<div class=tb>${[['c','Conversación'],['k','Cartas'],['a','Ajustes']].map(([t,n])=>`<button data-t=${t} class="${tab==t?'on':''}">${n}</button>`).join('')}<button data-a=x style="flex:0 0 46px">✕</button></div>`;
 if(tab=='c'){
  h+='<p class=m>Audios de la otra persona, en orden. El primero suena al contestar (“¿aló?”); entre uno y otro hablas tú.</p>';
  cfg.conv.forEach((k,i)=>{h+=row(k,'Audio '+(i+1))+`<div class=r2><button data-a=up data-i=${i}>▲</button><button data-a=dn data-i=${i}>▼</button><button data-a=rm data-i=${i}>Quitar</button></div>`});
  h+='<button class=big data-a=add>+ Añadir audio</button>'}
 if(tab=='k'){
  h+='<div class=tb style="position:static">'+[1,2,3,4].map(s=>`<button data-s=${s} class="${su==s?'on':''}">${SY[s]}</button>`).join('')+'</div><p class=m>Graba a la persona diciendo la carta, por ejemplo: «el siete de corazones».</p>';
  for(let v=1;v<=13;v++)h+=row('c'+su+'_'+v,cname(v,su))}
 if(tab=='a')h+=`<div class=r><span>Fondo de pantalla (foto)</span><label class=b>Subir<input type=file accept="image/*" data-k=bg hidden></label><button data-a=rmk data-k=bg ${have.has('bg')?'':'disabled'}>Quitar</button></div>
<div class=r><span>Icono propio (opcional)</span><label class=b>Subir<input type=file accept="image/*" data-k=icon hidden></label><button data-a=rmk data-k=icon ${have.has('icon')?'':'disabled'}>Quitar</button></div>
<div class=r><span>Pausa automática (seg). 0 = tocar</span><input id=gp type=number min=0 max=30 value="${cfg.gap}"></div>
<p class=m>Código al desbloquear: 4 dígitos = valor (01–13) + palo (1♣ 2♥ 3♠ 4♦) + cualquier dígito. Ej.: 7 de corazones → 0720. Un código inválido tiembla como si fallaras.<br><br>Con la pausa en 0, toca el número en la pantalla de llamada para que suene el siguiente audio.<br><br>Para entrar aquí: mantén pulsada la hora en la pantalla de bloqueo.<br><br>Tus audios, fotos y ajustes se guardan en este teléfono, dentro de la app donde los pongas: configúralo desde el acceso directo de la pantalla de inicio, no desde Safari.<br><br>Si grabas aquí, recarga la app antes de actuar.</p>`;
 $('#ad').innerHTML=h}
async function rec(k){
 if(R){R.stop();return}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[],mr=new MediaRecorder(st);
  mr.ondataavailable=e=>e.data.size&&ch.push(e.data);
  mr.onstop=async()=>{st.getTracks().forEach(t=>t.stop());R=null;RK=null;await put(k,new Blob(ch,{type:mr.mimeType||'audio/mp4'}));have.add(k);render()};
  R=mr;RK=k;mr.start();render()}catch(x){alert('No se pudo usar el micrófono')}}
async function pv(k){const b=await get(k);if(!b)return;A.pause();A.onended=null;A.src=URL.createObjectURL(b);A.play().catch(()=>{})}
$('#ad').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset,i=+d.i;
 if(d.t)tab=d.t;else if(d.s)su=+d.s;
 else if(d.a=='x'){go('lk');return}
 else if(d.a=='rec'){await rec(d.k);return}
 else if(d.a=='pl'){pv(d.k);return}
 else if(d.a=='rmk'){await del(d.k);have.delete(d.k);applyBg();applyIcon()}
 else if(d.a=='add'){cfg.n++;cfg.conv.push('k'+cfg.n);save()}
 else if(d.a=='up'&&i>0){[cfg.conv[i-1],cfg.conv[i]]=[cfg.conv[i],cfg.conv[i-1]];save()}
 else if(d.a=='dn'&&i<cfg.conv.length-1){[cfg.conv[i+1],cfg.conv[i]]=[cfg.conv[i],cfg.conv[i+1]];save()}
 else if(d.a=='rm'){const k=cfg.conv[i];cfg.conv.splice(i,1);save();have.delete(k);await del(k)}
 else return;
 render()};
$('#ad').onchange=async e=>{const t=e.target;
 if(t.type=='file'&&t.files[0]){await put(t.dataset.k,t.files[0]);have.add(t.dataset.k);if(t.dataset.k=='bg')applyBg();if(t.dataset.k=='icon')applyIcon();render()}
 else if(t.id=='gp'){cfg.gap=Math.max(0,+t.value||0);save()}};
</script></body></html>
